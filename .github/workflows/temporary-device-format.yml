name: Temporary Dart formatter
on:
  pull_request:
    branches: [main, 'infra/**', 'feat/**']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
      - name: Format new device UI files and print exact output
        run: |
          dart format lib/services/device_management_panel.dart test/device_management_panel_test.dart
          echo '--- DEVICE PANEL ---'
          cat lib/services/device_management_panel.dart
          echo '--- WIDGET TEST ---'
          cat test/device_management_panel_test.dart
