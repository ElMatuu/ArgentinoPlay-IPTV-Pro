name: Flutter CI
on:
  push:
    branches: [main, 'rebuild/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Generate Android platform scaffolding
        run: flutter create --platforms=android --project-name argentino_play .

      - name: Configure Android app identity and TV launcher support
        shell: python
        run: |
          from pathlib import Path
          import sys

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text(encoding="utf-8")
          expected = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

          if source.count(expected) != 1:
              print("::error::No se reconoce el manifiesto Android generado por Flutter.")
              sys.exit(1)

          source = source.replace(
              expected,
              expected + """
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              """,
              1,
          )

          source = source.replace('android:label="argentino_play"', 'android:label="ArgentinoPlay"', 1)
          import re

          launcher_pattern = re.compile(
              r'(<category\s+android:name="android.intent.category.LAUNCHER"\s*/>\s*</intent-filter>)'
          )
          match = launcher_pattern.search(source)
          if match is None or "android.intent.category.LEANBACK_LAUNCHER" in source:
              print("::error::No se encontró un intent-filter móvil único para ampliar.")
              sys.exit(1)
          tv_launcher = """
              <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LEANBACK_LAUNCHER"/>
              </intent-filter>"""
          source = source[:match.end()] + tv_launcher + source[match.end():]
          manifest.write_text(source, encoding="utf-8")

          gradle = Path("android/app/build.gradle.kts")
          gradle_source = gradle.read_text(encoding="utf-8")
          placeholder = 'applicationId = "com.example.argentino_play"'
          if gradle_source.count(placeholder) != 1:
              print("::error::No se encontró el applicationId Flutter esperado.")
              sys.exit(1)
          application_id = "com.argentinoplay.app"
          gradle_source = gradle_source.replace(
              placeholder, f'applicationId = "{application_id}"', 1
          )
          namespace_placeholder = 'namespace = "com.example.argentino_play"'
          if gradle_source.count(namespace_placeholder) != 1:
              print("::error::No se encontró el namespace Android esperado.")
              sys.exit(1)
          gradle_source = gradle_source.replace(
              namespace_placeholder, f'namespace = "{application_id}"', 1
          )
          gradle.write_text(gradle_source, encoding="utf-8")

          kotlin_source = Path(
              "android/app/src/main/kotlin/com/example/argentino_play/MainActivity.kt"
          )
          kotlin_target = Path(
              "android/app/src/main/kotlin/com/argentinoplay/app/MainActivity.kt"
          )
          if not kotlin_source.is_file() or kotlin_target.exists():
              print("::error::No se encontró el entry point Kotlin esperado o el destino ya existe.")
              sys.exit(1)
          kotlin_text = kotlin_source.read_text(encoding="utf-8")
          old_package = "package com.example.argentino_play"
          if kotlin_text.count(old_package) != 1:
              print("::error::El package del entry point Kotlin no coincide con el scaffold esperado.")
              sys.exit(1)
          kotlin_target.parent.mkdir(parents=True, exist_ok=True)
          kotlin_target.write_text(
              kotlin_text.replace(old_package, "package com.argentinoplay.app", 1),
              encoding="utf-8",
          )
          kotlin_source.unlink()

          if 'applicationId = "com.argentinoplay.app"' not in gradle_source:
              print("::error::Application ID no quedó configurado.")
              sys.exit(1)
          if 'namespace = "com.argentinoplay.app"' not in gradle_source:
              print("::error::Namespace no quedó configurado.")
              sys.exit(1)
          if "package com.argentinoplay.app" not in kotlin_target.read_text(encoding="utf-8"):
              print("::error::Package Kotlin no quedó configurado.")
              sys.exit(1)

          print("Manifiesto Android configurado: Internet, launcher móvil y Android TV.")
          print("Application ID, namespace y entry point Kotlin: com.argentinoplay.app")


      - name: Configure and verify Android API 36
        id: android_sdk
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "::error::No se encontró sdkmanager. No se puede instalar ni verificar Android API 36."
            exit 1
          fi

          echo "Aceptando licencias del SDK Android (la salida queda visible)."
          "$SDKMANAGER" --licenses < <(yes)

          echo "Instalando Android SDK Platform 36."
          "$SDKMANAGER" --install "platforms;android-36"

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          existing = [path for path in candidates if path.is_file()]
          if len(existing) != 1:
              print(
                  "::error::Se esperaba exactamente un archivo Gradle de la app "
                  f"(build.gradle.kts o build.gradle); encontrados: {existing}"
              )
              sys.exit(1)

          gradle_file = existing[0]
          source = gradle_file.read_text(encoding="utf-8")
          patterns = [
              re.compile(
                  r"(?m)^(\s*compileSdk\s*=\s*)"
                  r"(?:flutter\.compileSdkVersion|\d+)(\s*)$"
              ),
              re.compile(
                  r"(?m)^(\s*compileSdkVersion\s+)"
                  r"(?:flutter\.compileSdkVersion|\d+)(\s*)$"
              ),
              re.compile(
                  r"(?m)^(\s*compileSdk\s+)"
                  r"(?:flutter\.compileSdkVersion|\d+)(\s*)$"
              ),
          ]
          updated = source
          replacements = 0
          for pattern in patterns:
              updated, count = pattern.subn(r"\g<1>36\g<2>", updated)
              replacements += count

          if replacements != 1:
              print(
                  f"::error::No se pudo fijar compileSdk a 36 de forma inequívoca "
                  f"en {gradle_file}; coincidencias: {replacements}."
              )
              print("Contenido actual del archivo para diagnóstico:")
              print(source)
              sys.exit(1)

          gradle_file.write_text(updated, encoding="utf-8")
          print(f"Configuración aplicada: {gradle_file} -> compileSdk 36")

          properties = Path("android/gradle.properties")
          if not properties.is_file():
              print("::error::Falta android/gradle.properties; no se puede activar el reporte completo de advertencias Gradle.")
              sys.exit(1)

          lines = properties.read_text(encoding="utf-8").splitlines()
          warning_setting = "org.gradle.warning.mode=all"
          matching = [i for i, line in enumerate(lines) if line.strip().startswith("org.gradle.warning.mode=")]
          if matching:
              lines[matching[0]] = warning_setting
              for index in reversed(matching[1:]):
                  del lines[index]
          else:
              lines.append(warning_setting)
          properties.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"Configuración aplicada: {properties} -> {warning_setting}")
          PY

          echo "Plataformas Android instaladas:"
          "$SDKMANAGER" --list_installed
          echo "Valor compileSdk configurado:"
          grep -nE 'compileSdk(Version)?[[:space:]]*(=|)[[:space:]]*36' android/app/build.gradle*

      - name: Upload generated Android platform scaffold
        uses: actions/upload-artifact@v4
        with:
          name: android-platform-scaffold
          path: android/
          if-no-files-found: error
          retention-days: 7

      - name: Install dependencies
        run: flutter pub get

      - name: Report toolchain versions
        run: |
          flutter --version
          dart --version
          java -version
          echo "Android SDK: ${ANDROID_HOME:-${ANDROID_SDK_ROOT:-not-set}}"

      - name: Validate Dart formatting (no silent workspace rewrites)
        id: format
        run: |
          set -euo pipefail
          echo "Validando formato con dart format --set-exit-if-changed --output=none."
          if dart format --set-exit-if-changed --output=none lib test; then
            echo "Formato validado: lib/ y test/ cumplen el estilo oficial sin cambios."
            exit 0
          fi
          echo "Hay archivos Dart que no cumplen 'dart format'."
          dart format lib test
          git --no-pager diff -- lib test | sed -e 's/ /·/g' -e 's/	/→/g' > /tmp/format.diff || true
          size="$(wc -c < /tmp/format.diff)"
          echo "Diff de formato (espacios marcados con punto medio): ${size} bytes."
          split -b 850 -d /tmp/format.diff /tmp/fmt_
          exit 1

      - name: Publish format diff annotations 1-10
        if: always() && steps.format.outcome == 'failure'
        run: |
          count=0
          for chunk in /tmp/fmt_*; do
            count=$((count+1))
            if [[ $count -le 10 ]]; then
              msg="$(cat "${chunk}" | sed 's/%/%25/g; s/\r/%0D/g' | tr '\n' '\001' | sed 's/\x01/%0A/g')"
              echo "::error title=Format diff ${count}::${msg}"
            fi
          done

      - name: Publish format diff annotations 11-20
        if: always() && steps.format.outcome == 'failure'
        run: |
          count=0
          for chunk in /tmp/fmt_*; do
            count=$((count+1))
            if [[ $count -ge 11 && $count -le 20 ]]; then
              msg="$(cat "${chunk}" | sed 's/%/%25/g; s/\r/%0D/g' | tr '\n' '\001' | sed 's/\x01/%0A/g')"
              echo "::error title=Format diff ${count}::${msg}"
            fi
          done

      - name: Publish format diff annotations 21-30
        if: always() && steps.format.outcome == 'failure'
        run: |
          count=0
          for chunk in /tmp/fmt_*; do
            count=$((count+1))
            if [[ $count -ge 21 && $count -le 30 ]]; then
              msg="$(cat "${chunk}" | sed 's/%/%25/g; s/\r/%0D/g' | tr '\n' '\001' | sed 's/\x01/%0A/g')"
              echo "::error title=Format diff ${count}::${msg}"
            fi
          done

      - name: Publish format diff annotations 31-40
        if: always() && steps.format.outcome == 'failure'
        run: |
          count=0
          for chunk in /tmp/fmt_*; do
            count=$((count+1))
            if [[ $count -ge 31 && $count -le 40 ]]; then
              msg="$(cat "${chunk}" | sed 's/%/%25/g; s/\r/%0D/g' | tr '\n' '\001' | sed 's/\x01/%0A/g')"
              echo "::error title=Format diff ${count}::${msg}"
            fi
          done

      - name: Static analysis (warnings and infos are fatal)
        id: analyze
        run: |
          if flutter analyze --fatal-infos --fatal-warnings > /tmp/analyze.out 2>&1; then
            cat /tmp/analyze.out
          else
            code=$?
            cat /tmp/analyze.out
            sed -e 's/%/%25/g' -e 's/\r/%0D/g' /tmp/analyze.out | tr '\n' '\001' | sed 's/\x01/%0A/g' > /tmp/analyze.msg
            split -b 850 -d /tmp/analyze.msg /tmp/az_
            count=0
            for chunk in /tmp/az_*; do
              count=$((count+1))
              echo "::error title=Analyze output ${count}::$(cat "${chunk}")"
            done
            exit ${code}
          fi

      - name: Automated tests
        id: tests
        run: |
          if flutter test --reporter expanded > /tmp/test.out 2>&1; then
            cat /tmp/test.out
          else
            code=$?
            cat /tmp/test.out
            sed -n '/EXCEPTION/,$p' /tmp/test.out | head -c 8000 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | tr '\n' '\001' | sed 's/\x01/%0A/g' > /tmp/test.msg
            split -b 850 -d /tmp/test.msg /tmp/ts_
            count=0
            for chunk in /tmp/ts_*; do
              count=$((count+1))
              echo "::error title=Test output ${count}::$(cat "${chunk}")"
            done
            exit ${code}
          fi

      - name: Build debug APK (full Gradle diagnostics)
        id: build
        run: |
          if flutter build apk --debug > /tmp/build.out 2>&1; then
            cat /tmp/build.out
          else
            code=$?
            cat /tmp/build.out
            tail -c 8000 /tmp/build.out | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | tr '\n' '\001' | sed 's/\x01/%0A/g' > /tmp/build.msg
            split -b 850 -d /tmp/build.msg /tmp/bu_
            count=0
            for chunk in /tmp/bu_*; do
              count=$((count+1))
              echo "::error title=Build output ${count}::$(cat "${chunk}")"
            done
            exit ${code}
          fi

      - name: Upload debug APK
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: argentino-play-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: CI result summary
        if: always()
        shell: bash
        env:
          ANDROID_SDK_OUTCOME: ${{ steps.android_sdk.outcome }}
          FORMAT_OUTCOME: ${{ steps.format.outcome }}
          ANALYZE_OUTCOME: ${{ steps.analyze.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          printf 'Android SDK/API 36: %s\n' "${ANDROID_SDK_OUTCOME:-not-run}"
          printf 'Formatting: %s\n' "${FORMAT_OUTCOME:-not-run}"
          printf 'Static analysis: %s\n' "${ANALYZE_OUTCOME:-not-run}"
          printf 'Automated tests: %s\n' "${TESTS_OUTCOME:-not-run}"
          printf 'Debug APK build: %s\n' "${BUILD_OUTCOME:-not-run}"
          printf 'Artifact upload: %s\n' "${UPLOAD_OUTCOME:-not-run}"

          if [[ "${BUILD_OUTCOME:-}" != "success" ]]; then
            echo "Nota: la compilación del APK debug solo se omite cuando un paso previo no terminó en success (tests: ${TESTS_OUTCOME:-not-run})."
          fi
          if [[ "${UPLOAD_OUTCOME:-}" != "success" ]]; then
            echo "Nota: la subida del artefacto APK solo se omite cuando la compilación del APK no terminó en success (build: ${BUILD_OUTCOME:-not-run})."
          fi

          for outcome in "$ANDROID_SDK_OUTCOME" "$FORMAT_OUTCOME" "$ANALYZE_OUTCOME" "$TESTS_OUTCOME" "$BUILD_OUTCOME" "$UPLOAD_OUTCOME"; do
            if [[ "$outcome" != "success" ]]; then
              echo "::error::CI incompleta o fallida. Revisá el primer paso que no terminó en success y su registro detallado."
              exit 1
            fi
          done
