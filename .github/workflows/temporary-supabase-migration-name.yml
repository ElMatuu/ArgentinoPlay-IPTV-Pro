name: Temporary Supabase migration name generator
on:
  pull_request:
    branches: [main, 'infra/**', 'feat/**']
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.79.0
      - name: Generate migration with the pinned Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new tighten_authenticated_table_grants
          migration_file="$(find supabase/migrations -maxdepth 1 -type f -name '*_tighten_authenticated_table_grants.sql' -print -quit)"
          test -n "$migration_file"
          echo "GENERATED_MIGRATION_PATH=$migration_file"
          echo '--- GENERATED MIGRATION CONTENT ---'
          cat "$migration_file"
