name: Apply exact Dart formatter output

on:
  push:
    branches:
      - feat/supabase-auth-service

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-account-screen-again]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Apply formatter and show resulting diff
        run: |
          dart --version
          dart format lib/services/account_screen.dart
          git diff -- lib/services/account_screen.dart
      - name: Commit formatter output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/account_screen.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply complete Dart formatter output"
          git push origin "HEAD:$GITHUB_REF_NAME"
