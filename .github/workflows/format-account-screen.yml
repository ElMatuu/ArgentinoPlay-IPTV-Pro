name: Apply exact Dart formatting to account screen

on:
  push:
    branches:
      - feat/supabase-auth-service

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-account-screen]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Format only the changed screen
        run: dart format lib/services/account_screen.dart
      - name: Commit formatter output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/services/account_screen.dart
          if git diff --cached --quiet; then
            echo "Dart formatter made no changes."
            exit 0
          fi
          git commit -m "Apply Dart formatter output to account screen"
          git push origin "HEAD:$GITHUB_REF_NAME"
