name: Apply exact Dart formatter output to device tests

on:
  push:
    branches:
      - feat/supabase-auth-service

permissions:
  contents: write

jobs:
  format:
    if: contains(github.event.head_commit.message, '[format-device-test]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true
      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Format only the new device test
        run: dart format test/device_registration_service_test.dart
      - name: Commit exact formatter output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test/device_registration_service_test.dart
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply Dart formatter to device registration tests"
          git push origin "HEAD:$GITHUB_REF_NAME"
